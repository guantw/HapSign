[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hapsign"
dynamic = ["version"]
description = "HarmonyOS HAP automatic debug signing and installation tool"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "guantw"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "requests>=2.31,<3",
]

[project.optional-dependencies]
playwright = [
    "playwright>=1.40,<2",
]
gui = [
    "PySide6-Essentials>=6.8,<7",
    "playwright>=1.40,<2",
]
bundle = [
    "PyInstaller>=6.14,<7",
]
dev = [
    "pre-commit>=4,<5",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.12,<1",
]

[project.scripts]
hapsign = "hapsign.cli:main"

[project.gui-scripts]
hapsign-app = "hapsign.gui:main"

[project.urls]
Homepage = "https://github.com/guantw/HapSign"
Source = "https://github.com/guantw/HapSign"
Issues = "https://github.com/guantw/HapSign/issues"
Changelog = "https://github.com/guantw/HapSign/blob/master/CHANGELOG.md"
Security = "https://github.com/guantw/HapSign/security"

[tool.setuptools.dynamic]
version = {attr = "hapsign.__version__"}

[tool.setuptools.packages.find]
include = ["hapsign*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["hapsign"]
omit = ["hapsign/gui.py"]

[tool.coverage.report]
fail_under = 58
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"
